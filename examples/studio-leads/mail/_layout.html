<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f1ec;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#1c1917;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ec;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#fffcf8;border:1px solid #ddd4c7;border-radius:8px;">
            <tr>
              <td style="padding:20px 28px;border-bottom:1px solid #ddd4c7;font-weight:600;font-size:15px;">{{ app.name }}</td>
            </tr>
            <tr>
              <td style="padding:28px;font-size:15px;line-height:1.55;">
                {{{ body }}}
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px;border-top:1px solid #ddd4c7;font-size:12px;color:#57534e;">
                Sent by {{ app.name }}. You get this because you own this lead.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
