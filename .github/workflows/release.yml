name: release

# Two ways in:
# - Push to main. If there are pending changesets, changesets/action opens or
#   updates the "Version Packages" PR. When that PR is merged there are none
#   left, so the same job publishes the new versions to npm.
# - Run it by hand (workflow_dispatch). dry_run defaults to true, which builds,
#   packs and runs npm publish --dry-run without touching the registry.
#
# Publishing uses npm trusted publishing (OIDC). No npm token is stored in
# the repo or passed to this workflow: npm trades the job's short lived GitHub
# id-token for a one time publish token. Each of the four packages has this
# file (release.yml, repo km321/bakorin) set as its trusted publisher on
# npmjs.com. See RELEASING.md.
#
# Provenance: npm adds provenance on its own for trusted publishing, but only
# when the GitHub repository is public. While km321/bakorin is private, npm
# skips it, so do not pass --provenance (npm would fail the publish).
#
# Prereleases go to the dist tag in the version (0.1.0-beta.1 -> beta). See
# distTag() in scripts/publish-packages.ts.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and npm publish --dry-run only"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      # No registry-url: that would write an .npmrc with a placeholder token.
      # npm defaults to registry.npmjs.org and uses OIDC on its own.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm 11.5.1 or later (needed for trusted publishing)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Pack check
        run: bun run pack:check

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: bun scripts/publish-packages.ts --dry-run

      - name: Version PR or publish
        if: github.event_name == 'push' || !inputs.dry_run
        # v1.7.0 or later only writes an npm auth line when NPM_TOKEN is set.
        # Older versions wrote "undefined", which broke the OIDC exchange.
        uses: changesets/action@v1.9.0
        with:
          version: bun run version-packages
          publish: bun run release:publish
          title: "Version Packages"
          commit: "Version Packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do not add NPM_TOKEN or NODE_AUTH_TOKEN here. Publishing is OIDC
          # only. A token here would hide a broken trusted publisher setup.
