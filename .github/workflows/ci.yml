name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: bun test (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bakorin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Every boot() based test runs on this dialect. Postgres only tests run in both jobs.
      BAKORIN_TEST_DIALECT: ${{ matrix.dialect }}
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bakorin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Full test suite
        run: bun test
      - name: Build admin UI
        if: matrix.dialect == 'sqlite'
        run: bun run build:ui

  security:
    name: dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit
      - name: Secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --verbose --redact --config .gitleaks.toml
