name: ci

on:
  push:
  pull_request:

jobs:
  sqlite:
    name: bun test (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"
      - run: bun install --frozen-lockfile
      - name: SQLite tests
        run: bun test
      - run: bun run build:ui

  postgres:
    name: bun test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bakorin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"
      - run: bun install --frozen-lockfile
      - name: Postgres tests
        run: bun test tests/postgres.test.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bakorin
