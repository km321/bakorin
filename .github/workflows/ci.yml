name: ci

on:
  push:
  pull_request:

jobs:
  sqlite:
    name: bun test (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"
      - run: bun install --frozen-lockfile
      - name: SQLite tests
        run: bun test
      - run: bun run build:ui

  postgres:
    name: bun test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bakorin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"
      - run: bun install --frozen-lockfile
      - name: Postgres tests
        run: bun test tests/postgres.test.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bakorin

  security:
    name: dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit
        continue-on-error: true
      - name: Secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --verbose --redact --config .gitleaks.toml
