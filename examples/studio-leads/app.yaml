app:
  name: studio-leads
  version: "0.1.0"
  description: Lead and task tracker for a small studio. Auth is email plus password.

runtime:
  dialect: sqlite
  host: 0.0.0.0
  port: 4371
  sqlite:
    path: ./data/app.db
  files:
    driver: local
    path: ./data/uploads
    maxBytes: 10485760
    allowedMimeTypes: [image/png, image/jpeg, image/webp, image/gif, application/pdf, text/plain]
    signedUrlTtlSeconds: 900
  jwt:
    secret: ${JWT_SECRET:-dev-only-change-me}
    accessTtlSeconds: 900
    refreshTtlSeconds: 2592000
  backups:
    interval: 24h
    retain: 14
    destination: ./data/backups
  hooks: ./hooks.ts
  cors:
    origins: ["*"]

auth:
  entity: users
  identity: email
  password: password
  role: role
  adminRole: admin
  requireVerifiedEmail: false

entities:
  users:
    auth: true
    label: User
    plural: Users
    display: name
    description: Studio members who own leads and tasks.
    fields:
      email:
        type: email
        unique: true
        required: true
        description: Sign-in identity.
      password:
        type: password
        required: true
        description: At least 8 characters. Stored as argon2id.
      name:
        type: text
        required: true
        description: Display name in the admin UI.
      role:
        type: enum
        values: [user, admin]
        default: user
        writable: admin
        description: admin can read every record and run backups. Only admins may set this field.
    policies:
      read: authenticated
      create: admin
      update: owner(id)
      delete: admin

  leads:
    label: Lead
    plural: Leads
    display: company
    description: Inbound studio inquiries.
    fields:
      company:
        type: text
        required: true
        description: Company or project name.
      contactName:
        type: text
        required: true
        description: Person to talk to.
      email:
        type: email
        required: true
        description: Contact email.
      status:
        type: enum
        values: [new, qualified, won, lost]
        default: new
        description: Pipeline stage.
      notes:
        type: text
        description: Internal notes.
      ownerId:
        type: relation
        to: users
        required: true
        description: Owner of this lead.
      brief:
        type: file
        description: Optional brief or attachment.
    indexes:
      - [ownerId, status]
    policies:
      read: [owner(ownerId), admin]
      create: authenticated
      update: owner(ownerId)
      delete: owner(ownerId)

  tasks:
    label: Task
    plural: Tasks
    display: title
    description: Follow-ups attached to a lead.
    fields:
      title:
        type: text
        required: true
        description: What needs doing.
      done:
        type: boolean
        default: false
        description: Completed flag.
      dueOn:
        type: date
        description: Optional due date.
      leadId:
        type: relation
        to: leads
        description: Related lead, if any.
      ownerId:
        type: relation
        to: users
        required: true
        description: Assignee.
    policies:
      read: [owner(ownerId), admin]
      create: authenticated
      update: owner(ownerId)
      delete: owner(ownerId)

# Transactional email. Templates live in ./mail. See docs/mail.md.
mail:
  - name: lead-assigned
    entity: leads
    events: [create]
    to: "{{ expand.ownerId.email }}"
    template: new-lead
    expand: [ownerId]

  - name: lead-won
    entity: leads
    events: [update]
    changed: [status]
    when:
      status: won
    to: "{{ expand.ownerId.email }}"
    subject: "Won: {{ record.company }}"
    template: lead-won
    expand: [ownerId]
