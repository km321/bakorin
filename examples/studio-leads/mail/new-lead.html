<h1 style="margin:0 0 12px;font-size:20px;">New lead for {{ expand.ownerId.name }}</h1>
<p style="margin:0 0 16px;">{{ record.contactName }} from <strong>{{ record.company }}</strong> just came in.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;font-size:14px;margin:0 0 20px;">
  <tr>
    <td style="padding:6px 0;color:#57534e;width:120px;">Contact</td>
    <td style="padding:6px 0;">{{ record.contactName }}, {{ record.email }}</td>
  </tr>
  <tr>
    <td style="padding:6px 0;color:#57534e;">Status</td>
    <td style="padding:6px 0;">{{ record.status }}</td>
  </tr>
  {{#if record.notes}}
  <tr>
    <td style="padding:6px 0;color:#57534e;vertical-align:top;">Notes</td>
    <td style="padding:6px 0;">{{ record.notes }}</td>
  </tr>
  {{/if}}
</table>
<p style="margin:0;">
  <a href="{{ app.url }}/admin/#leads" style="display:inline-block;background:#6f4b1e;color:#fffaf3;text-decoration:none;padding:10px 16px;border-radius:6px;font-weight:600;">Open in admin</a>
</p>
