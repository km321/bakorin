<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bakorin API docs</title>
    <script src="/docs/theme.js?v=2"></script>
    <link rel="stylesheet" href="/docs/swagger-ui.css" />
    <link rel="stylesheet" href="/docs/page.css?v=2" />
  </head>
  <body>
    <header class="docs-banner">
      <p>
        Bakorin API docs from <code>/api/v1/openapi.json</code>. Try-it-out uses the admin session token in this browser when present; otherwise open Authorize and paste a bearer token.
      </p>
      <div class="docs-banner-actions">
        <div class="docs-theme" role="radiogroup" aria-label="Color theme">
          <button type="button" role="radio" data-mode="system" aria-checked="true">System</button>
          <button type="button" role="radio" data-mode="light" aria-checked="false">Light</button>
          <button type="button" role="radio" data-mode="dark" aria-checked="false">Dark</button>
        </div>
        <a href="/admin/">Admin</a>
      </div>
    </header>
    <main id="swagger-ui"></main>
    <script src="/docs/swagger-ui-bundle.js"></script>
    <script src="/docs/init.js?v=2"></script>
  </body>
</html>
