name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: bun test (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres, mysql, mariadb]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bakorin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bakorin
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bakorin
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Every boot() based test uses this dialect. Server specific tests use these URLs.
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/bakorin
      MYSQL_TEST_URL: ${{ matrix.dialect == 'mariadb' && 'mariadb://root:root@127.0.0.1:3307/bakorin' || 'mysql://root:root@127.0.0.1:3306/bakorin' }}
      BAKORIN_TEST_DIALECT: ${{ matrix.dialect }}
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bakorin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Full test suite
        run: bun test
      - name: Build admin UI
        if: matrix.dialect == 'sqlite'
        run: bun run build:ui

  e2e:
    name: starters e2e (${{ matrix.frontend }}, ${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: [astro, next]
        dialect: [sqlite, postgres, mysql, mariadb]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bakorin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bakorin
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bakorin
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The runner creates and drops its own database on this server.
      DATABASE_URL: ${{ matrix.dialect == 'mysql' && 'mysql://root:root@127.0.0.1:3306/bakorin' || matrix.dialect == 'mariadb' && 'mariadb://root:root@127.0.0.1:3307/bakorin' || 'postgres://postgres:postgres@127.0.0.1:5432/bakorin' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Install the starter
        run: bun install
        working-directory: examples/${{ matrix.frontend }}-starter
      - name: Sign in, protected page, CRUD, realtime, upload, accessibility
        run: bun scripts/e2e-starters/run.ts --frontend ${{ matrix.frontend }} --dialect ${{ matrix.dialect }} --screenshots e2e-shots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.frontend }}-${{ matrix.dialect }}
          path: |
            e2e-shots
            /tmp/bakorin-e2e-*.png
          if-no-files-found: ignore

  templates:
    name: templates e2e (${{ matrix.template }}, ${{ matrix.frontend }}, ${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [blank, auth-only, blog, marketing, saas, store, membership]
        frontend: [astro, next]
        dialect: [sqlite]
        include:
          # Postgres for the templates with the most server logic, one frontend each.
          - { template: blog, frontend: next, dialect: postgres }
          - { template: marketing, frontend: astro, dialect: postgres }
          - { template: saas, frontend: astro, dialect: postgres }
          - { template: store, frontend: next, dialect: postgres }
          - { template: membership, frontend: astro, dialect: postgres }
          # MySQL and MariaDB: auth, JSON, richtext, files and Stripe starter tables.
          - { template: blog, frontend: astro, dialect: mysql }
          - { template: store, frontend: next, dialect: mysql }
          - { template: membership, frontend: astro, dialect: mysql }
          - { template: blog, frontend: next, dialect: mariadb }
          - { template: saas, frontend: astro, dialect: mariadb }
          - { template: store, frontend: astro, dialect: mariadb }
          - { template: membership, frontend: next, dialect: mariadb }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bakorin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bakorin
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bakorin
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: ${{ matrix.dialect == 'mysql' && 'mysql://root:root@127.0.0.1:3306/bakorin' || matrix.dialect == 'mariadb' && 'mariadb://root:root@127.0.0.1:3307/bakorin' || 'postgres://postgres:postgres@127.0.0.1:5432/bakorin' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Scaffold, seed, build, and drive the template
        run: bun scripts/e2e-templates/run.ts --template ${{ matrix.template }} --frontend ${{ matrix.frontend }} --dialect ${{ matrix.dialect }} --screenshots template-shots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-${{ matrix.template }}-${{ matrix.frontend }}-${{ matrix.dialect }}
          path: |
            template-shots
            /tmp/bakorin-tpl-*.png
          if-no-files-found: ignore

  security:
    name: dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        # GHSA-fc5q-39xc-vjpf: picomatch ReDoS (<=4.0.7). Dev and build only
        # (vite and @changesets/cli), not in any published package, and no
        # patched version exists yet. Remove this ignore once picomatch ships
        # a fix.
        run: bun audit --ignore=GHSA-fc5q-39xc-vjpf
      - name: Secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --verbose --redact --config .gitleaks.toml
